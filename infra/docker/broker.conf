brokerClusterName=content-cluster
brokerName=content-broker
brokerId=0
brokerIP1=127.0.0.1
listenPort=30911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
autoCreateTopicEnable=false
# Hardening C2 (C-14): message retention in hours, stated explicitly. Consumer receipts are kept at least this long plus 24 h
# (content.retention.broker-reserved-hours must match); raising it requires raising the receipt retention too.
fileReservedTime=72
