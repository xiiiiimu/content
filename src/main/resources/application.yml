spring:
  application:
    name: content
  datasource:
    url: ${CONTENT_DB_URL:jdbc:mysql://127.0.0.1:23306/content?connectionTimeZone=UTC}
    username: ${CONTENT_MYSQL_USER:content}
    password: ${CONTENT_MYSQL_PASSWORD:}
  flyway:
    clean-disabled: true
server:
  address: 127.0.0.1
  port: ${CONTENT_API_PORT:28080}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
