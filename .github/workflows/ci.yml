name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  assistant-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assistant-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: assistant-python/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-rocketmq-test-evidence
          retention-days: 7
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/relay-evidence/**
            target/redis-candidate-evidence/**
            target/feed-merge-evidence/**
            target/pipeline-evidence/**
            target/recovery-evidence/**
            target/distribution-evidence/**
